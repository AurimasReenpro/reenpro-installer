<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InstallerApp - Foto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet" />
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-filled { font-variation-settings: 'FILL' 1; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#490891', 'primary-container': '#490891', 'on-primary': '#ffffff',
                        'primary-light': '#8052b2', 'primary-fixed': '#ecdcff', 'on-primary-fixed': '#280056',
                        'secondary-container': '#e2250a', 'on-tertiary-container': '#fd7461',
                        notify: '#fc391d', 'avatar-accent': '#b71500', 'app-bg': '#f6f5fa',
                        'surface-bright': '#ffffff', 'surface-container-low': '#fbf0ff', 'surface-container': '#f6e9ff',
                        'surface-variant': '#eedbff', 'on-surface': '#1d033a', 'on-surface-variant': '#4b4452',
                        'outline-variant': '#cdc3d4', outline: '#7c7484'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    boxShadow: { upward: '0px -4px 16px rgba(29,3,58,0.1)' }
                }
            }
        }
    </script>
</head>
<body class="bg-app-bg text-on-surface font-sans antialiased pt-[116px] pb-[60px]">

    <!-- Header & Filter -->
    <div class="fixed top-0 left-0 w-full z-50 bg-white shadow-sm">
        <!-- Top Bar -->
        <header class="w-full h-[56px] flex items-center px-4 justify-between border-b border-outline-variant/20">
            <div class="flex items-center">
                <a href="mobile-site-detail.html" class="p-2 -ml-2 active:scale-95 transition-transform text-primary flex items-center">
                    <span class="material-symbols-outlined">arrow_back</span>
                </a>
                <h1 class="text-[18px] font-bold text-on-surface ml-2">Foto</h1>
            </div>
            <button class="p-2 -mr-2 active:scale-95 transition-transform text-on-surface flex items-center">
                <span class="material-symbols-outlined">filter_list</span>
            </button>
        </header>

        <!-- Horizontal Scroll Filter Pills -->
        <div class="w-full h-[60px] flex items-center px-4 overflow-x-auto no-scrollbar gap-2">
            <button class="whitespace-nowrap px-4 py-2 rounded-full border border-outline-variant text-[14px] font-semibold text-on-surface-variant active:bg-surface-variant">
                Prieš darbą: 5
            </button>
            <button class="whitespace-nowrap px-4 py-2 rounded-full bg-primary text-white text-[14px] font-semibold shadow-sm">
                Darbo metu: 23
            </button>
            <button class="whitespace-nowrap px-4 py-2 rounded-full border border-outline-variant text-[14px] font-semibold text-on-surface-variant active:bg-surface-variant">
                Po darbo: 8
            </button>
            <button class="whitespace-nowrap px-4 py-2 rounded-full border border-outline-variant text-[14px] font-semibold text-on-surface-variant active:bg-surface-variant">
                Problemos: 0
            </button>
            <button class="whitespace-nowrap px-4 py-2 rounded-full border border-outline-variant text-[14px] font-semibold text-on-surface-variant active:bg-surface-variant">
                Kita: 2
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="p-4 space-y-6">
        
        <!-- Big Upload Buttons Row -->
        <div class="flex gap-3">
            <button class="flex-1 bg-primary text-white h-[56px] rounded-[12px] font-bold text-[14px] flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-sm">
                <span class="material-symbols-outlined text-[20px]">photo_camera</span>
                Naudoti kamerą
            </button>
            <button class="flex-1 bg-surface-bright border-2 border-primary text-primary h-[56px] rounded-[12px] font-bold text-[14px] flex items-center justify-center gap-2 active:scale-95 transition-transform">
                <span class="material-symbols-outlined text-[20px]">image</span>
                Iš galerijos
            </button>
        </div>

        <!-- Photo Grid 3-col -->
        <div class="grid grid-cols-3 gap-2">
            <!-- Items (using picsum.photos for solar/roof like images) -->
            <div class="aspect-square relative rounded-[8px] overflow-hidden shadow-sm bg-surface-variant">
                <img src="https://picsum.photos/id/1043/300/300" class="w-full h-full object-cover" alt="Solar panel">
                <div class="absolute bottom-1 left-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded font-mono">11:30</div>
            </div>
            <div class="aspect-square relative rounded-[8px] overflow-hidden shadow-sm bg-surface-variant">
                <img src="https://picsum.photos/id/1057/300/300" class="w-full h-full object-cover" alt="Installation">
                <div class="absolute bottom-1 left-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded font-mono">11:15</div>
            </div>
            <div class="aspect-square relative rounded-[8px] overflow-hidden shadow-sm bg-surface-variant">
                <img src="https://picsum.photos/id/1076/300/300" class="w-full h-full object-cover" alt="Roof">
                <div class="absolute bottom-1 left-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded font-mono">10:45</div>
            </div>
            
            <div class="aspect-square relative rounded-[8px] overflow-hidden shadow-sm bg-surface-variant">
                <img src="https://picsum.photos/id/122/300/300" class="w-full h-full object-cover" alt="Wiring">
                <div class="absolute bottom-1 left-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded font-mono">10:10</div>
            </div>
            <div class="aspect-square relative rounded-[8px] overflow-hidden shadow-sm bg-surface-variant">
                <img src="https://picsum.photos/id/15/300/300" class="w-full h-full object-cover" alt="Inverter">
                <div class="absolute bottom-1 left-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded font-mono">09:50</div>
            </div>
            <div class="aspect-square relative rounded-[8px] overflow-hidden shadow-sm bg-surface-variant">
                <img src="https://picsum.photos/id/160/300/300" class="w-full h-full object-cover" alt="Tools">
                <div class="absolute bottom-1 left-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded font-mono">09:30</div>
            </div>

            <div class="aspect-square relative rounded-[8px] overflow-hidden shadow-sm bg-surface-variant">
                <img src="https://picsum.photos/id/175/300/300" class="w-full h-full object-cover" alt="Battery">
                <div class="absolute bottom-1 left-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded font-mono">09:15</div>
            </div>
            <div class="aspect-square relative rounded-[8px] overflow-hidden shadow-sm bg-surface-variant">
                <img src="https://picsum.photos/id/180/300/300" class="w-full h-full object-cover" alt="Workers">
                <div class="absolute bottom-1 left-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded font-mono">08:45</div>
            </div>
        </div>

    </main>

    <!-- Footer Stats -->
    <div class="fixed bottom-0 w-full bg-white h-[60px] border-t border-outline-variant/30 flex items-center justify-center z-50">
        <p class="text-[13px] text-on-surface-variant font-medium">Šiandien įkelta: 8 nuotraukos · 24 MB</p>
    </div>

</body>
</html>
